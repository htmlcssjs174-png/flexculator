name: iphone_calculator
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/flexculator_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/flexculator_app_icon.png"
  min_sdk_android: 21
  
flutter_native_splash:
  color: "#05070B"
  android: true
  ios: true

  android_12:
    color: "#05070B"